; Zone coordinates are percentages: left, top, right, bottom.
; Layouts support up to 9 zones so every zone has a number-key shortcut.

[Settings]
; Candidate windows must have at least this percentage of their own area
; overlapping the starting window to be included in Win+wheel cycling.
windowOverlapPercent=25
; Pixel inset applied to every side of the final snapped rectangle.
padding=0
; Suspend all ZoneSmith shortcuts while a fullscreen or borderless-fullscreen
; application is in the foreground.
pauseInFullscreen=true
; Add or remove ZoneSmith from the current user's Windows startup apps.
startWithWindows=false

horizontalCycleNotches=2

[ExcludedApps]
; Add executable names with a value of 1, then restart ZoneSmith.
; example-game.exe=1

[MonitorLayouts]
; Layout choices are saved here automatically when you scroll in Zone Mode.
; You can also set them manually, for example: DISPLAY1=Three Columns

